room:
  name: "bug6-bug-to-pr"
  description: "Bug to reviewed PR: triager, repro, fixer, reviewer, plus a human gate"
  bridge: "{bridge}"
  agents: ["bug6-triager", "bug6-repro", "bug6-fixer", "bug6-reviewer"]
  users: ["{$creator}"]
kickoff: |
  @bug6-triager the room is ready. Room creator: {$creator}. Humans: post a bug report, then state any constraints. To decide, the creator mentions the reviewer: @bug6-reviewer approve, or @bug6-reviewer reject <reason>, only when the reviewer asks.
