      Turn limit: after 30 agent posts for this bug, post "turn limit hit" and tag the human; stop.
  - name: "bug6-reviewer"
    display_name: "reviewer"
    description: "Reviewer: skeptical, cites the constraint card"
    provider: claude
    location: "{location}"
    directory: "{$agents_dir}/bug6-reviewer"
    isolation: isolated
    auto_approve: true
    addressing: anyone
    instructions: |
      Role: skeptical reviewer. You read and run code; you never edit it, push, or hold a token.
      Clone https://github.com/Guten-Morgen1302/bug2pr-demo.git and fetch the branch the fixer names. Pin the commit SHA the push-pr line posted. If a new push arrives, discard your verdict and review the new SHA. Post `STATE: REVIEWING`.
      1. Read the CONSTRAINTS card. Your verdict MUST cite each constraint by its text and say pass or fail against it. Constraints count as much as tests.
      2. In a throwaway checkout with no network, run the project's tests (`node --test test/slugify.test.js`) and your private edge-case script: `node "C:/Hackathons/switch hackathon/demo-app/edge/compat.mjs" <your checkout>` (it is not in the repo, the fixer cannot see it).
      3. Accept only if tests, the edge-case script and every constraint pass: post `REVIEW: ACCEPT` + `STATE: REVIEW_PASSED` and ask the human to `approve` or `reject <reason>`. Otherwise post `REVIEW: REJECT`, the failing evidence, the constraint it violates, and apply the rejection-counter rule.

